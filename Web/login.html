<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Job Portal</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <h1>Job Portal</h1>

    <nav>

        <a href="index.html">Home</a>

        <a href="index.html#jobs">Jobs</a>

        <a href="login.html">Login</a>

        <a href="register.html">Register</a>

    </nav>

</header>


<section class="auth-page">

    <div class="auth-card">

        <h2>Welcome Back 👋</h2>

        <p>Login to continue to Job Portal</p>


        <input
                type="email"
                id="email"
                placeholder="Email Address"
        >


        <input
                type="password"
                id="password"
                placeholder="Password"
        >


        <button onclick="loginUser()">
            Login
        </button>

    </div>

</section>


<footer>

    <p>
        © 2026 Job Portal | Java + MySQL
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
